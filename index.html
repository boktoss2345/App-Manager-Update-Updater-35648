      rootEl.classList.remove("ad-on");
      rootEl.setAttribute("aria-hidden", "true");
      containerEl.innerHTML = "";
      chromeEl.innerHTML = "";
      countdownNode = null;
      countdownCfg = null;
      unlockScroll();

      var maxShows = numOrNull(pick(config, ["behavior.maxShows", "maxShows", "timing.maxShows"], null));
      if (maxShows !== null && maxShows > 0 && showCount >= maxShows) return;

      var repeat = timingNum("repeatEverySeconds", 45, null);
      if (repeat > 0 && ads.length) {
        scheduleNext(repeat);
      }
    }

    function scheduleNext(seconds) {
      clearTimeout(timers.next);
      timers.next = null;
      var s = numOrNull(seconds);
      if (s === null) return;
      if (s < 0) s = 0;
      timers.next = setTimeout(showNext, s * 1000);
    }

    /* ============================================================
       GLOBAL EVENTS
       ============================================================ */
    function onOverlayClick(ev) {
      var t = ev.target;
      if (t === rootEl || t === scrimEl || t === stageEl || t === containerEl || t === chromeEl) {
        if (dismissOnOutsideTap) closeAd();
      }
    }

    function onKeyDown(ev) {
      if (!showing) return;
      /* Escape only closes if the config allows outside dismissal. */
      if ((ev.key === "Escape" || ev.keyCode === 27) && dismissOnOutsideTap) closeAd();
    }

    if (rootEl) rootEl.addEventListener("click", onOverlayClick);
    document.addEventListener("keydown", onKeyDown);

    /* ============================================================
       LOAD FROM ads.json
       ============================================================ */
    function load(cfg) {
      if (!isObj(cfg)) return;

      config = cfg;

      var enabled = boolVal(pick(cfg, ["enabled", "adsEnabled", "isEnabled"], true), true);
      var timingEnabled = boolVal(pick(cfg, ["timing.enabled", "behavior.enabled", "schedule.enabled"], true), true);

      ads = normalizeAds(cfg);

      if (!enabled || !timingEnabled || !ads.length) return;

      scheduleNext(timingNum("initialDelaySeconds", 1, null));
    }

    return {
      load: load,
      show: showNext,
      close: closeAd,
      isShowing: function () { return showing; },
      getConfig: function () { return config; },
      getAds: function () { return ads.slice(); }
    };
  })();

  /* Small public API for native layer / console debugging */
  window.AdManager = {
    show: function () { AdSystem.show(); },
    close: function () { AdSystem.close(); },
    isShowing: function () { return AdSystem.isShowing(); },
    config: function () { return AdSystem.getConfig(); },
    ads: function () { return AdSystem.getAds(); }
  };

  /* Fetch ads.json, parse it, store it, forward it, render it. */
  function loadAdsConfig() {
    if (typeof fetch !== "function") {
      console.error("ADS CONFIG ERROR:", "fetch() is not supported in this WebView");
      return;
    }

    var url = ADS_CONFIG_URL + "?t=" + Date.now();

    fetch(url, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status + " " + response.statusText);
        }
        return response.json();
      })
      .then(function (config) {
        window.REMOTE_ADS_CONFIG = config;

        /* Forward the COMPLETE JSON configuration to Android (if present) */
        sendAdsConfigToAndroid(config);

        /* Render the ads entirely from the remote configuration */
        try {
          AdSystem.load(config);
        } catch (adError) {
          console.error("ADS RENDER ERROR:", adError);
        }
      })
      .catch(function (error) {
        console.error("ADS CONFIG ERROR:", error);
      });
  }

  /* ============================================================
     INIT
     ============================================================ */
  function init() {
    initTheme();

    var frag = document.createDocumentFragment();
    for (var i = 0; i < state.length; i++) {
      frag.appendChild(buildCard(state[i], i));
    }
    grid.appendChild(frag);

    for (var j = 0; j < state.length; j++) {
      syncCard(state[j]);
    }

    renderUpdates();
    applyFilter();
    refreshStats();

    /* Load remote advertising configuration */
    loadAdsConfig();
  }

  init();
})();
</script>

</body>
</html>
